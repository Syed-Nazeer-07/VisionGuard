<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20261111" />
    <link rel="alternate icon" href="/favicon.ico?v=20261111" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=20261111" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=20261111" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20261111" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7f3" />
    <script>
      (() => {
        let appearance;
        try { appearance = localStorage.getItem('visionguard:appearance'); } catch {}
        if (appearance !== 'light' && appearance !== 'dark') appearance = 'system';
        const dark = appearance === 'dark' || (appearance === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.appearance = appearance;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#101714' : '#f6f7f3';
      })();
    </script>
    <style>html { background:#f6f7f3; color-scheme:light; } html[data-theme=dark] { background:#101714; color-scheme:dark; }</style>
    <title>VisionGuard</title>
    <meta name="description" content="Browser-first vehicle tracking, traffic video analysis and human-led incident review." />
    <meta property="og:title" content="VisionGuard" />
    <meta property="og:description" content="Browser-first vehicle tracking, traffic video analysis and human-led incident review." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
