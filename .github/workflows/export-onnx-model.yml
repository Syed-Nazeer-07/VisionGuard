name: Export YOLO11 ONNX (n/s/m, manual license acknowledgement required)

on:
  workflow_dispatch:
    inputs:
      model_variant:
        description: 'n = fastest, s = better accuracy, m = highest accuracy of these options (slower)'
        type: choice
        options:
          - 'n'
          - 's'
          - 'm'
        default: 's'
        required: true
      accept_upstream_license:
        description: 'I have reviewed and accepted the Ultralytics weights/code license for my intended use'
        type: choice
        options:
          - 'no'
          - 'yes'
        default: 'no'
        required: true

permissions:
  contents: read

jobs:
  export-model:
    if: ${{ inputs.accept_upstream_license == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only export dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "ultralytics>=8.3,<9" "onnx>=1.16,<2" "onnxruntime>=1.20,<2"
      - name: Export selected licensed COCO80 model (static 640px, no NMS)
        env:
          VARIANT: ${{ inputs.model_variant }}
        run: |
          case "$VARIANT" in n|s|m) ;; *) echo "Invalid model variant"; exit 2 ;; esac
          python scripts/export_yolo11n.py --weights "yolo11${VARIANT}.pt" \
            --download-upstream --acknowledge-license \
            --output "apps/web/public/models/yolo11${VARIANT}.onnx"
      - name: Validate model shape and run actual CPU inference smoke test
        env:
          VARIANT: ${{ inputs.model_variant }}
        run: |
          python scripts/validate_yolo_onnx.py --model "apps/web/public/models/yolo11${VARIANT}.onnx" --json > model-manifest.json
          python scripts/smoke_yolo_onnx.py --model "apps/web/public/models/yolo11${VARIANT}.onnx"
          cat model-manifest.json
      - name: Preserve validated model for local deployment (no Git commit)
        uses: actions/upload-artifact@v4
        with:
          name: visionguard-yolo11${{ inputs.model_variant }}-onnx
          path: |
            apps/web/public/models/yolo11*.onnx
            model-manifest.json
          if-no-files-found: error
          retention-days: 7
