name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Browser app lint, build, tests and architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        id: install
        run: npm ci
      # Mirror Cloudflare Workers Builds after a fresh npm ci. Some npm lockfiles
      # omit Linux native optional packages even though Rolldown needs them.
      - name: Repair Cloudflare Rolldown binding
        run: node scripts/ensure-native-build-binding.mjs
      # Both Rolldown and Oxlint are repaired in one npm operation above,
      # avoiding transient package pruning by a second --no-save install.
      - run: npm run lint
      - name: Build production-style Worker assets (synthetic public CI variables)
        env:
          VITE_SUPABASE_URL: https://ci-test.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_ci_test_only_public_fixture
          VITE_YOLO_MODEL_URL: https://models.example.org/yolo11s.onnx
          VITE_VIDEO_STORAGE_PROVIDER: b2
        run: npm run build:pages
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: npm run test -w web
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      # DOM unit tests can't detect an element visually covering a link.
      # Chrome checks actual pointer hits, responsive menu, and native
      # /login + /register navigation at multiple viewport widths.
      - name: Browser-level landing click-target smoke test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          python3 -m pip install --disable-pip-version-check 'selenium==4.29.0'
          python3 scripts/smoke_landing_hit_targets.py

      - name: Test Cloudflare Pages release guard
        run: npm run test:deploy
      - name: Verify annotated browser-tracking scorecard
        run: npm run test:tracking-eval
      - name: Enforce browser-first architecture
        run: npm run test:architecture

