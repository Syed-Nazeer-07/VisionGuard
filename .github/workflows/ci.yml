name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend lint, typecheck, build, and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        id: install
        run: npm ci
      # Mirror Cloudflare Workers Builds after a fresh npm ci. Some npm lockfiles
      # omit Linux native optional packages even though Rolldown needs them.
      - name: Repair Cloudflare Rolldown binding
        run: node scripts/ensure-native-build-binding.mjs
      # Both Rolldown and Oxlint are repaired in one npm operation above,
      # avoiding transient package pruning by a second --no-save install.
      - run: npm run lint
      - name: Build production-style Worker assets (synthetic public CI variables)
        env:
          VITE_SUPABASE_URL: https://ci-test.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_ci_test_only_public_fixture
          VITE_YOLO_MODEL_URL: https://models.example.org/yolo11s.onnx
          VITE_VIDEO_STORAGE_PROVIDER: b2
        run: npm run build:pages
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: npm run test -w web
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}

      - name: Test Cloudflare Pages release guard
        run: npm run test:deploy

  backend-source:
    name: Backend syntax and deterministic analysis tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q backend/app backend/tests
      - run: python -m pip install -r backend/requirements.txt
      # Tests use deterministic fake detector/tracker and no external model.
      # --noconftest avoids importing the real API startup fixture.
      - run: PYTHONPATH=backend python -m pytest -q --noconftest backend/tests/test_overspeed_events.py backend/tests/test_processor_metrics.py
      # No YOLO model weights are stored in Git. This check deliberately
      # avoids claiming to run the real-video inference test suite.
      - name: Check overspeed counter behavior
        run: |
          PYTHONPATH=backend python - <<'PY'
          from app.pipeline.overspeed_events import OverspeedEventCounter
          counter = OverspeedEventCounter()
          for flag in [True] * 8 + [False] * 3 + [True] * 3:
              counter.observe(1, flag)
          assert counter.count == 2, counter.count
          print("Speeding episode count: OK")
          PY
