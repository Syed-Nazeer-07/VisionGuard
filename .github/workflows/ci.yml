name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend lint, typecheck, build, and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        id: install
        run: npm ci
      # Some npm lockfiles omit platform-specific optional packages. Pin the
      # Linux binary to the exact installed oxlint version, without changing
      # package.json or package-lock.json.
      - name: Ensure Linux oxlint binding is installed
        run: |
          OXLINT_VERSION=$(node -p "require('./apps/web/node_modules/oxlint/package.json').version")
          npm install --no-save --no-package-lock --no-audit "@oxlint/binding-linux-x64-gnu@${OXLINT_VERSION}"
      - run: npm run lint
      - run: npm run build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: npm run test -w web
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}

  b2-edge:
    name: B2 Edge Function TypeScript check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Type-check the *actual* deployed Deno entrypoint in CI.
      # No B2 secrets, real uploads or external database are needed.
      - name: Verify video-storage function compiles for Deno
        run: deno check supabase/functions/video-storage/index.ts

  backend-source:
    name: Backend syntax and deterministic analysis tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q backend/app backend/tests
      - run: python -m pip install -r backend/requirements.txt
      # Tests use deterministic fake detector/tracker and no external model.
      # --noconftest avoids importing the real API startup fixture.
      - run: PYTHONPATH=backend python -m pytest -q --noconftest backend/tests/test_overspeed_events.py backend/tests/test_processor_metrics.py backend/tests/test_speed_event_artifact.py backend/tests/test_video_source_security.py backend/tests/test_job_source_guards.py
      # No YOLO model weights are stored in Git. This check deliberately
      # avoids claiming to run the real-video inference test suite.
      - name: Check overspeed counter behavior
        run: |
          PYTHONPATH=backend python - <<'PY'
          from app.pipeline.overspeed_events import OverspeedEventCounter
          counter = OverspeedEventCounter()
          for flag in [True] * 8 + [False] * 3 + [True] * 3:
              counter.observe(1, flag)
          assert counter.count == 2, counter.count
          print("Speeding episode count: OK")
          PY

  model-contract:
    name: YOLO ONNX contract and environment doctor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # No actual model weights are in Git. These are synthetic model fixtures
      # that verify compatibility checks reject wrong tensor shapes / classes.
      - run: python -m pip install "onnx>=1.16,<2"
      - run: python -m unittest discover -s scripts/tests -v
      - run: python scripts/visionguard_doctor.py --ci --json

  run-history-schema:
    name: Run-scoped tracking migration integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: visionguard_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d visionguard_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate run-scoped migration and repeated analysis history
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: visionguard_ci
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/run_track_history_integration.sql
      - name: Verify cross-user RLS and owned-video artifact writes
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          psql -X -v ON_ERROR_STOP=1 -d postgres -c "CREATE DATABASE visionguard_security_ci"
          psql -X -v ON_ERROR_STOP=1 -d visionguard_security_ci -f supabase/tests/security_policy_integration.sql
